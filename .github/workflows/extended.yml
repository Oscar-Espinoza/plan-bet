name: Extended checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Deliberately keyless: no DATABASE_URL, FOOTBALL_DATA_API_TOKEN, or
    # OPENAI_API_KEY is set anywhere in this job. Leaving them genuinely unset
    # (rather than set to "") lets drizzle-kit fall back to the local URL in
    # drizzle.config.ts, and proves the build degrades to demo mode.

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails when src/db/schema.ts was edited without running pnpm db:generate.
      # git diff alone is not enough: drift produces an *untracked* .sql file,
      # so the porcelain check is the one that actually catches it.
      - name: Migration drift
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::src/db/schema.ts has drifted from drizzle/. Run pnpm db:generate and commit the result."
            git status --porcelain drizzle
            git --no-pager diff -- drizzle
            exit 1
          fi

      - name: Build
        run: pnpm build
